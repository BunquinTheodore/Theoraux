<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#000000"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <text x="72" y="74" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="15" letter-spacing="3" fill="#8a8a8a">SYSTEM &#183; DECISION ENGINE</text>
  <text x="72" y="128" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#ffffff">AI Customer Support &amp; Escalation</text>

  <!-- Row 1: ingest -->
  <g font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="17">
    <rect x="72" y="252" width="452" height="60" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="94" y="288" fill="#ffffff">Messenger &#183; Instagram &#183; Web Form</text>

    <text x="542" y="290" fill="#ffffff" fill-opacity="0.35" font-size="22">&#8594;</text>

    <rect x="572" y="252" width="170" height="60" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="594" y="288" fill="#c8c8c8">Normalize</text>

    <text x="758" y="290" fill="#ffffff" fill-opacity="0.35" font-size="22">&#8594;</text>

    <rect x="788" y="252" width="340" height="60" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="810" y="288" fill="#c8c8c8">Load Sheets (1 batch call)</text>
  </g>

  <!-- Row 2: gates -->
  <g font-family="ui-monospace, 'IBM Plex Mono', monospace">
    <rect x="72" y="372" width="200" height="60" rx="4" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.22"/>
    <text x="94" y="408" font-size="17" fill="#ffffff">One message</text>

    <text x="292" y="410" fill="#ffffff" fill-opacity="0.35" font-size="22">&#8594;</text>

    <line x1="340" y1="372" x2="340" y2="656" stroke="#ffffff" stroke-opacity="0.18"/>

    <g font-size="15" fill="#b3b3b3">
      <text x="368" y="404"><tspan fill="#666">01</tspan>   human already replied? &#8594; stay silent</text>
      <text x="368" y="450"><tspan fill="#666">02</tspan>   urgency or distress? &#8594; escalate first</text>
      <text x="368" y="496"><tspan fill="#666">03</tspan>   supported language?</text>
      <text x="368" y="542"><tspan fill="#666">04</tspan>   confident, single intent?</text>
      <text x="368" y="588"><tspan fill="#666">05</tspan>   preconditions met?</text>
      <text x="368" y="634"><tspan fill="#666">06</tspan>   already answered recently?</text>
    </g>
  </g>

  <!-- Outcomes -->
  <g font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="17">
    <rect x="72" y="716" width="688" height="70" rx="4" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.4"/>
    <text x="98" y="758" fill="#ffffff">&#10003; ANSWER &#8212; template + real data, in seconds</text>

    <rect x="784" y="716" width="688" height="70" rx="4" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-opacity="0.6"/>
    <text x="810" y="758" fill="#fca5a5">&#9679; ESCALATE &#8212; human inbox, order pre-looked-up</text>
  </g>

  <!-- Footer -->
  <line x1="72" y1="900" x2="1528" y2="900" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="72" y="936" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="14" fill="#8a8a8a">n8n &#183; Google Sheets &#183; Gmail &#183; Gemini</text>
  <text x="1528" y="936" text-anchor="end" font-family="ui-monospace, 'IBM Plex Mono', monospace" font-size="14" fill="#d4d4d4">34 live test messages &#183; 3 channels unified &#183; 0 tolerance for a wrong answer</text>
</svg>
